{% if book %}
    <h2>Return Book</h2>
    <p>Are you sure you want to return "{{ book.title }}" by {{ book.author }}?</p>
    <form action="{% url 'book-detail' book.pk %}" method="post">
        {% csrf_token %}
        <button type="submit">Yes, Return</button>
    </form>
{% else %}
    <p>Already returned.</p>
{% endif %}
