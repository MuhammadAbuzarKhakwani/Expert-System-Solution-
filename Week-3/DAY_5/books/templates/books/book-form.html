{% extends 'base.html' %}

{% block title %}{% if book %}Edit Book{% else %}Add Book{% endif %}{% endblock %}

{% block content %}
    <h1>{% if book %}Edit Book{% else %}Add Book{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a href="{% url 'book-list' %}"><button type="button">Cancel</button></a>
    </form>

{% endblock %}
